
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071923">
<title>Random Number Generator</title>

<style>
:root {
  color-scheme: dark;
  --bg: #071923;
  --panel: #102b38;
  --panel2: #153746;
  --accent: #58e0b1;
  --text: #f4fbff;
  --muted: #a9c2cc;
  --danger: #ff9a9a;
}

* { box-sizing: border-box; }

html, body {
  width: 100%;
  min-height: 100%;
  margin: 0;
}

body {
  min-height: 100svh;
  background: radial-gradient(ellipse at 50% 0%, #174454 0%, var(--bg) 65%);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: grid;
  place-items: center;
  padding: clamp(12px, 2.5vw, 32px);
}

.app {
  width: min(100%, 1500px);
  min-height: min(92svh, 900px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: clamp(18px, 3vh, 32px);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

h1 {
  margin: 0;
  font-size: clamp(1.05rem, 2.3vw, 1.8rem);
  letter-spacing: .04em;
  font-weight: 700;
}

.tag {
  color: var(--muted);
  font-size: clamp(.72rem, 1.2vw, .95rem);
}

.display {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 10px 0;
}

#number {
  width: 100%;
  font-size: clamp(5rem, min(35vw, 55vh), min(42vw, 34rem));
  font-weight: 850;
  line-height: .95;
  letter-spacing: -.055em;
  overflow-wrap: anywhere;
  color: var(--accent);
  text-shadow: 0 8px 45px #58e0b133;
  font-variant-numeric: tabular-nums;
}

#number.placeholder {
  color: #d8e8ed;
  font-size: clamp(3.5rem, 15vw, 13rem);
}

.status {
  min-height: 1.5em;
  margin-top: 18px;
  margin-bottom: 12px;
  color: var(--muted);
  font-size: clamp(.85rem, 1.5vw, 1.1rem);
}

.progress {
  color: var(--accent);
  font-size: clamp(.85rem, 1.5vw, 1.1rem);
  font-weight: 700;
  margin-bottom: 20px;
}

.main-generate {
  min-width: clamp(190px, 28vw, 340px);
  min-height: clamp(58px, 8vh, 82px);
  font-size: clamp(1.15rem, 2.2vw, 1.7rem);
}

.controls {
  background: #0d2632dd;
  border: 1px solid #ffffff1a;
  border-radius: 24px;
  padding: clamp(14px, 2vw, 26px);
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: clamp(10px, 1.5vw, 20px);
  align-items: end;
  box-shadow: 0 18px 55px #0003;
}

label {
  display: block;
  color: var(--muted);
  font-size: clamp(.8rem, 1.2vw, 1rem);
  margin: 0 0 8px 3px;
}

input {
  width: 100%;
  min-width: 0;
  border: 1px solid #ffffff25;
  border-radius: 13px;
  background: var(--panel2);
  color: var(--text);
  padding: 14px 15px;
  font: inherit;
  font-size: clamp(1rem, 1.7vw, 1.35rem);
  outline: none;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px #58e0b122;
}

button {
  border: 0;
  border-radius: 14px;
  min-height: 54px;
  padding: 13px 25px;
  background: var(--accent);
  color: #06251d;
  font: inherit;
  font-weight: 800;
  font-size: clamp(1rem, 1.6vw, 1.25rem);
  cursor: pointer;
  white-space: nowrap;
  transition: transform .12s ease, filter .12s ease;
}

button:hover:not(:disabled) {
  filter: brightness(1.06);
}

button:active:not(:disabled) {
  transform: scale(.98);
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.tools {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 12px;
}

.secondary {
  min-height: 40px;
  padding: 8px 14px;
  border-radius: 10px;
  background: #ffffff14;
  color: var(--text);
  font-size: .9rem;
  font-weight: 600;
  border: 1px solid #ffffff20;
}

#reset {
  background: #ffffff14;
  color: var(--text);
}

#error {
  grid-column: 1 / -1;
  color: var(--danger);
  min-height: 1.2em;
  font-size: .9rem;
}

.completed {
  color: var(--accent) !important;
  font-size: clamp(2rem, 6vw, 5rem) !important;
  letter-spacing: 0 !important;
  line-height: 1.1 !important;
}

@media (max-width: 600px) and (orientation: portrait) {
  .app {
    min-height: 94svh;
    gap: 12px;
  }

  header { align-items: flex-start; }

  .controls {
    grid-template-columns: 1fr 1fr;
    border-radius: 18px;
  }

  .main-generate {
    width: min(100%, 340px);
  }

  #number {
    font-size: clamp(5rem, 29vw, 12rem);
  }

  #number.placeholder {
    font-size: clamp(3rem, 14vw, 6rem);
  }

  .display { min-height: 35svh; }
}

@media (max-width: 700px) and (orientation: landscape) {
  body { padding: 8px 16px; }

  .app {
    min-height: 96svh;
    gap: 8px;
  }

  header { min-height: 24px; }

  h1 { font-size: 1rem; }

  .tag { font-size: .7rem; }

  .display { padding: 0; }

  #number { font-size: clamp(4rem, 34vh, 16rem); }

  #number.placeholder {
    font-size: clamp(3rem, 18vh, 8rem);
  }

  .controls {
    grid-template-columns: 1fr 1fr auto;
    padding: 9px 12px;
    gap: 9px;
    border-radius: 14px;
  }

  label {
    margin-bottom: 4px;
    font-size: .75rem;
  }

  input {
    padding: 9px 10px;
    font-size: 1rem;
  }

  button {
    min-height: 42px;
    padding: 8px 14px;
    font-size: .95rem;
  }

  .main-generate {
    min-height: 48px;
    width: min(75vw, 300px);
    font-size: 1.05rem;
  }

  .status { margin-bottom: 8px; }

  .tools { margin-top: 4px; }

  .secondary {
    min-height: 30px;
    padding: 4px 10px;
    font-size: .75rem;
  }

  .status {
    margin-top: 5px;
    font-size: .75rem;
  }
}

@media (min-width: 1000px) {
  .controls {
    max-width: 1050px;
    width: 100%;
    align-self: center;
  }
}
</style>
</head>

<body>

<main class="app">

  <header>
    <h1>RANDOM NUMBER GENERATOR</h1>
    <div class="tag">Choose a range · No repetition</div>
  </header>

  <section class="display" aria-live="polite" aria-atomic="true">
    <div style="width:100%">

      <div id="number" class="placeholder">READY?</div>

      <div class="status" id="status">
        Enter your minimum and maximum numbers.
      </div>

      <div class="progress" id="progress">
        Numbers remaining: 0
      </div>

      <button class="main-generate" id="generate">
        GENERATE
      </button>

    </div>
  </section>

  <section>

    <div class="controls">

      <div>
        <label for="minimum">Minimum number</label>
        <input id="minimum" type="number" step="1" value="1" inputmode="numeric">
      </div>

      <div>
        <label for="maximum">Maximum number</label>
        <input id="maximum" type="number" step="1" value="100" inputmode="numeric">
      </div>

      <div id="error" role="alert"></div>

    </div>

    <div class="tools">
      <button class="secondary" id="reset" type="button">
        ↻ Reset
      </button>

      <button class="secondary" id="fullscreen" type="button">
        ⛶ Full screen
      </button>
    </div>

  </section>

</main>

<script>

const minInput = document.getElementById('minimum');
const maxInput = document.getElementById('maximum');
const numberDisplay = document.getElementById('number');
const status = document.getElementById('status');
const progress = document.getElementById('progress');
const error = document.getElementById('error');
const generateButton = document.getElementById('generate');

let numbers = [];
let currentIndex = 0;
let lastMin = null;
let lastMax = null;

// Shuffle numbers randomly (Fisher-Yates algorithm)
function shuffle(array) {

  for (let i = array.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] = [array[j], array[i]];

  }

  return array;
}

// Validate and prepare the selected range
function prepareNumbers() {

  const min = Number(minInput.value);
  const max = Number(maxInput.value);

  if (
    minInput.value.trim() === '' ||
    maxInput.value.trim() === '' ||
    !Number.isSafeInteger(min) ||
    !Number.isSafeInteger(max)
  ) {
    error.textContent = 'Please enter valid whole numbers.';
    return false;
  }

  if (min > max) {
    error.textContent = 'Minimum must be less than or equal to maximum.';
    return false;
  }

  const total = max - min + 1;

  // Prevent excessively large ranges
  if (!Number.isSafeInteger(total) || total > 1000000) {
    error.textContent = 'Please select a range containing no more than 1,000,000 numbers.';
    return false;
  }

  error.textContent = '';

  numbers = [];

  for (let i = min; i <= max; i++) {
    numbers.push(i);
  }

  shuffle(numbers);

  currentIndex = 0;

  lastMin = min;
  lastMax = max;

  numberDisplay.textContent = 'READY?';
  numberDisplay.className = 'placeholder';

  status.textContent = 'Your numbers are ready. Press GENERATE.';
  progress.textContent = `Numbers remaining: ${total}`;

  generateButton.disabled = false;
  generateButton.textContent = 'GENERATE';

  return true;
}

// Generate the next unused number
function generateNumber() {

  const min = Number(minInput.value);
  const max = Number(maxInput.value);

  if (
    minInput.value.trim() === '' ||
    maxInput.value.trim() === '' ||
    !Number.isSafeInteger(min) ||
    !Number.isSafeInteger(max) ||
    min > max
  ) {
    prepareNumbers();
    return;
  }

  // Automatically reset if the range changes
  if (min !== lastMin || max !== lastMax) {

    if (!prepareNumbers()) return;

  }

  error.textContent = '';

  // Check whether all numbers have been displayed
  if (currentIndex >= numbers.length) {

    showCompleted();
    return;

  }

  const result = numbers[currentIndex];

  currentIndex++;

  numberDisplay.textContent = result.toLocaleString();
  numberDisplay.className = '';

  const remaining = numbers.length - currentIndex;

  progress.textContent =
    `Displayed: ${currentIndex} / ${numbers.length}  |  Remaining: ${remaining}`;

  status.textContent = 'Number selected successfully.';

  // All numbers have now been displayed
  if (remaining === 0) {

    generateButton.disabled = true;

    status.textContent = 'All numbers have been displayed!';

    progress.textContent =
      `Completed: ${currentIndex} / ${numbers.length}`;

  }

}

// Show completion message
function showCompleted() {

  numberDisplay.textContent = 'COMPLETED!';
  numberDisplay.className = 'completed';

  status.textContent = 'All numbers in this range have been displayed.';

  progress.textContent = `Completed: ${numbers.length} / ${numbers.length}`;

  generateButton.disabled = true;

  generateButton.textContent = 'FINISHED';

}

// Reset and shuffle the range again
function resetNumbers() {

  if (prepareNumbers()) {

    status.textContent = 'Sequence reset. All numbers are available again.';

  }

}

// Event listeners
generateButton.addEventListener('click', generateNumber);

document.getElementById('reset').addEventListener('click', resetNumbers);

[minInput, maxInput].forEach(input => {

  input.addEventListener('change', () => {

    prepareNumbers();

  });

  input.addEventListener('keydown', e => {

    if (e.key === 'Enter') generateNumber();

  });

});

document.getElementById('fullscreen').addEventListener('click', async () => {

  try {

    if (!document.fullscreenElement) {

      await document.documentElement.requestFullscreen();

    } else {

      await document.exitFullscreen();

    }

  } catch (_) {

    status.textContent = 'Full screen is not available in this browser.';

  }

});

// Prepare initial number sequence
prepareNumbers();

</script>

</body>
</html>
