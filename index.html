<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fajru Publisher</title>

<style>
body{
font-family:Segoe UI;
background:#111;
color:white;
padding:20px;
}

a{
display:block;
padding:10px;
margin:5px 0;
background:#222;
color:#9fe6a0;
text-decoration:none;
border-radius:6px;
}

a:hover{
background:#333;
}
</style>
</head>

<body>

<h2>Books</h2>
<div id="list">Loading...</div>

<script>

const owner = "mngbth";
const repo  = "fajru.com";

const url = `https://api.github.com/repos/$mngbth/$fajru.com/contents/`;

async function load(){

const res = await fetch(url);
const data = await res.json();

const list = document.getElementById("list");
list.innerHTML = "";

data.forEach(item=>{

if(item.type === "dir"){

const a = document.createElement("a");
a.href = item.html_url;
a.target = "_blank";
a.textContent = "📁 " + item.name;

list.appendChild(a);

}

});

}

load();

</script>

</body>
</html>
