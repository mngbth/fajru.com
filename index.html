<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fajru Publisher</title>

<style>
body{
font-family:Segoe UI;
background:#111;
color:white;
padding:20px;
}

a{
display:block;
padding:10px;
margin:5px 0;
background:#222;
color:#9fe6a0;
text-decoration:none;
border-radius:6px;
}

a:hover{
background:#333;
}
</style>
</head>

<body>

<h2>Books</h2>
<div id="list">Loading...</div>

<script>

const owner = "mngbth";
const repo  = "fajru.com";

/* ✅ FIXED URL */
const url = `https://api.github.com/repos/${owner}/${repo}/contents/`;

async function load(){

const list = document.getElementById("list");

try{

const res = await fetch(url);
const data = await res.json();

/* handle API errors clearly */
if(!res.ok){
list.innerHTML =
"❌ Error: " + data.message +
"<br><small>Repo may be private or name incorrect</small>";
return;
}

list.innerHTML = "";

/* filter folders only */
const folders = data.filter(item => item.type === "dir");

if(folders.length === 0){
list.innerHTML = "No folders found in root.";
return;
}

folders.forEach(item=>{

const a = document.createElement("a");
a.href = item.html_url;
a.target = "_blank";
a.textContent = "📁 " + item.name;

list.appendChild(a);

});

}catch(err){
list.innerHTML = "❌ Failed: " + err.message;
}

}

load();

</script>

</body>
</html>
