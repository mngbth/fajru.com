<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fajru Publisher</title>

<style>
body{
font-family:Segoe UI;
background:#111;
color:white;
padding:20px;
}

a{
display:block;
padding:10px;
margin:5px 0;
background:#222;
color:#9fe6a0;
text-decoration:none;
border-radius:6px;
}

a:hover{background:#333}
</style>
</head>

<body>

<h2>Books</h2>
<div id="list"></div>

<script>

const base = "https://fajru.com";

const folders = [
"Fehi Reyru",
"Fehi Reyru 2",
"Fehi Reyru 3"
];

const list = document.getElementById("list");

folders.forEach(f => {

const a = document.createElement("a");

/* THIS OPENS index.html INSIDE FOLDER */
a.href = `${base}/${f}/index.html`;
a.textContent = "📁 " + f;

list.appendChild(a);

});

</script>

</body>
</html>
